<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sporting Goods Store - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="card-container">
        <!-- Login Form -->
        <form id="loginForm">
            <h2>System Login</h2>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required placeholder="Enter username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Enter password">
            </div>
            <button type="submit">Login</button>
            <button type="button" class="link-btn" onclick="toggleForgotPass(true)">Forgot Password?</button>
        </form>

        <!-- Forgot Password Form (hidden by default) -->
        <form id="forgotForm" style="display: none;">
            <h2>Reset Password</h2>
            <div class="form-group">
                <label for="resetEmail">Email Address</label>
                <input type="email" id="resetEmail" required placeholder="Enter your registered email">
            </div>
            <button type="submit">Send Reset Link</button>
            <button type="button" class="link-btn" onclick="toggleForgotPass(false)">Back to Login</button>
        </form>
    </div>

    <script src="app.js"></script>
</body>
</html>
